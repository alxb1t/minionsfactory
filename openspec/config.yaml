schema: spec-driven

# A pointer, never a restatement. The two pages below are authoritative and are
# maintained where they live; anything copied here would be a fourth copy of the
# method that drifts the moment either page moves.
context: |
  This repository's method is stated once, in `docs/sdd.md` — the change contract and
  the four artifacts, the `Change:` trailer, the traceability bindings and the version
  line, the gate rules, the build loop, the findings contract and the release fold; and,
  in its Part II, what must be settled before a change is cut. Read it before authoring
  any artifact.

  What is true of this repository in particular — the six gate commands, the seams the
  work is tested at, the guardrails, the layout, and how a change is cut here — is in
  `CLAUDE.md`. Read it too.

  Neither page is restated in this file. Where an instruction below and either page
  disagree, the page wins and this file is the thing to fix.

rules:
  proposal:
    - "A change is always four artifacts — `proposal.md`, `specs/`, `design.md`, `tasks.md`. All four exist for every change, including one that changes no requirement."
    - "The `version:` frontmatter this repo's reader requires, and the way a change that changes no requirement declares that absence, are prescribed in `CLAUDE.md`, *How a change is cut here*, steps 3-4. Follow those steps as written; the mechanics are maintained there and are not copied here."
  specs:
    - "One `spec.md` per capability directory — `specs/<capability>/spec.md`. A `spec.md` at the root of `specs/` is a malformed change."
    - "Never invent a requirement to produce a delta. If nothing behavioural changes, declare the absence the way `CLAUDE.md`, *How a change is cut here*, step 4 prescribes."
  design:
    - "Sketch the seams the work will be tested at, and name them. Prefer a seam that already exists over a new one, and take the highest seam that gives the coverage — this repository lives on its seams (the `Provider` Protocol, the `run_gate` seam)."
    - "Name the actual files the approach touches. This repo's approach is expected to be concrete about paths; a design that names no file is not yet settled."
    - "Record the measurement behind each decision, not only the decision. `design.md` is the record this change was cut from — a rationale kept elsewhere is a rationale the next version re-derives."
  tasks:
    - "`tasks.md` opens with a `## Progress` checklist, one line per phase, in the form `- [ ] N — Title`: a single integer, an em dash, a title. `orchestrator/state.py` reads only that section and matches only that form."
    - "Each phase then gets its own `## N — Title` section. `- [ ] N.M` sub-tasks live inside those sections, where the progress parser never sees them. Never put an `N.M` item under `## Progress`."
    - "Every sub-task states how its completion is verified, as a command or an observable disk fact."
