schema: spec-driven

# A pointer, never a restatement. The pages below are authoritative and are
# maintained where they live; anything copied here is a second copy that drifts
# the moment a page moves.
context: |
  This repository's rules are in `docs/principles.md`, and its decisions in force in
  `docs/decisions.md`. Read both before authoring any artifact. A change that adds or
  overturns a decision in force edits `docs/decisions.md` in one of its phases.

  What is true of this repository in particular — the gate (`make gate`), the layout,
  the guardrails — is in `CLAUDE.md`. Read it too. A change is cut with the
  `mf-cut-change` skill, which carries the contract a change must meet.

  None of these pages is restated in this file. Where an instruction below and a page
  disagree, the page wins and this file is the thing to fix.

rules:
  proposal:
    - "A change is always four artifacts — `proposal.md`, `specs/`, `design.md`, `tasks.md`. All four exist for every change, including one that changes no requirement."
    - "`proposal.md` opens with `version: vX.Y` frontmatter (`vX.Y.Z` for a patch). The skills read it, and the CLI neither emits nor checks it."
  specs:
    - "One `spec.md` per capability directory — `specs/<capability>/spec.md`. A `spec.md` at the root of `specs/` is a malformed change."
    - "Never invent a requirement to produce a delta. If nothing behavioural changes, declare the absence: `skip_specs: true` in the change's `.openspec.yaml`, plus `specs/.gitkeep` so the directory stays tracked. The two go together; a spec file under `specs/` beside `skip_specs` fails validation."
  design:
    - "Sketch the seams the work will be tested at, and name them. Prefer a seam that already exists over a new one, and take the highest seam that gives the coverage."
    - "Name the actual files the approach touches. This repo's approach is expected to be concrete about paths; a design that names no file is not yet settled."
    - "Record the measurement behind each decision, not only the decision. `design.md` is the record this change was cut from — a rationale kept elsewhere is a rationale the next version re-derives."
  tasks:
    - "`tasks.md` opens with a `## Progress` checklist, one line per phase, in the form `- [ ] N — Title`: a single integer, an em dash, a title. `mf-build` ticks only that section, and only that form."
    - "Each phase then gets its own `## N — Title` section. `- [ ] N.M` sub-tasks live inside those sections. Never put an `N.M` item under `## Progress`."
    - "Every sub-task states how its completion is verified, as a command or an observable disk fact."
