[project]
name = "minions-factory"
version = "0.53.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
    "ty>=0.0.71",
    "zizmor>=1.32.0",
]

[tool.uv]
required-version = ">=0.12.19,<0.13"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: over 5 s; `make check` leaves it to the gate"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
