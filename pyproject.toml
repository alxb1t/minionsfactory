[project]
name = "minions-factory"
version = "0.100.1"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ast-grep-cli>=0.51.1,<0.52",
    "coverage>=7.17.1",
    "diff-cover>=11.0.1",
    "markdown-it-py>=3,<4",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
    "ty>=0.0.71",
    "zizmor>=1.32.0",
]

[tool.uv]
required-version = ">=0.12.19,<0.13"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "ANN", "B", "S"]
extend-select = ["UP", "ERA", "PERF", "SIM", "RET", "PT", "RUF", "PLE", "PLC", "PLR", "PLW", "BLE"]

[tool.coverage.run]
parallel = true
patch = ["subprocess"]
source = ["skills", "scripts"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short"]
markers = ["slow: over 5 s; `make check` leaves it to the gate"]

# Per file, not `ignore`, so a command-line `--select` keeps them.
[tool.ruff.lint.per-file-ignores]
"**" = [
    # The scripts' subprocesses are argv lists by design, never a shell string.
    "S603",
    # `git`, `make` and `uv` resolve on `PATH`, as the OpenSpec CLI does (D8).
    "S607",
    # Noise in the wider families: look-alike characters, list concatenation, branch and argument counts.
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF005",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLW1510",
]
# pytest's checks are plain asserts.
"tests/**" = ["D", "S101", "PT018"]
