[project]
name = "minions-factory"
version = "0.8.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.71",
]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "spec(key): bind this test to a spec scenario key (proves it)",
    "spec_exempt(reason): mark a genuinely structural test as traceable",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
