name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync (locked)
        run: uv sync --locked

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: ty
        run: uv run ty check

      - name: pytest
        run: uv run pytest -q
