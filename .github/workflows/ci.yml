name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.19"
          python-version: "3.12"

      - name: Install Betterleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz
          echo "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7  betterleaks_1.9.0_linux_x64.tar.gz" | sha256sum -c
          mkdir betterleaks-1.9.0
          tar -xzf betterleaks_1.9.0_linux_x64.tar.gz -C betterleaks-1.9.0
          sudo install betterleaks-1.9.0/betterleaks /usr/local/bin/betterleaks
          betterleaks version

      - name: Gate
        run: make gate DIFF_BASE=origin/main
