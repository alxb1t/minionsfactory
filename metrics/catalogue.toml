# What MinionsFactory measures at every change: the bundled collector,
# `skills/mf-build/scripts/metrics.py`, reads this file. Why: docs/decisions.md D43.

[[metric]]
id = "converge-reading-set"
title = "Converge conductor's reading set"
group = "instruction load"
unit = "words"
better = "lower"
watch = 10500
noise = 50
script = "scripts/metrics/reading_set.py"
args = ["converge"]

[[metric]]
id = "converge-worker-reading-set"
title = "Converge worker's reading set"
group = "instruction load"
unit = "words"
better = "lower"
noise = 50
script = "scripts/metrics/reading_set.py"
args = ["worker"]

[[metric]]
id = "shared-context"
title = "Shared context every station reads"
group = "instruction load"
unit = "words"
better = "lower"
noise = 50
script = "scripts/metrics/reading_set.py"
args = ["shared"]

[[metric]]
id = "rule-ids"
title = "Rule ids in the skills' tables"
group = "contract"
unit = "ids"
better = "lower"
script = "scripts/metrics/rule_ids.py"
args = []

[[metric]]
id = "tests-collected"
title = "Tests collected"
group = "proof"
unit = "tests"
better = "higher"
script = "scripts/metrics/tests_collected.py"
args = []

[[metric]]
id = "gate-seconds"
title = "Gate time"
group = "proof"
unit = "seconds"
better = "lower"
noise = 5
source = "station"

[[metric]]
id = "largest-module-lines"
