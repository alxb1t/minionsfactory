# What MinionsFactory measures at every change: the bundled collector,
# `skills/mf-build/scripts/metrics.py`, reads this file. Why: docs/decisions.md D43.

[[metric]]
id = "converge-reading-set"
title = "Converge conductor's reading set"
group = "instruction load"
unit = "words"
better = "lower"
watch = 10500
noise = 50
script = "scripts/metrics/reading_set.py"
args = ["converge"]

[[metric]]
id = "converge-conformance-reading-set"
title = "Converge conformance worker's reading set"
group = "instruction load"
unit = "words"
better = "lower"
watch = 10500
noise = 50
script = "scripts/metrics/reading_set.py"
args = ["conformance"]

[[metric]]
id = "converge-adversarial-reading-set"
title = "Converge adversarial worker's reading set"
group = "instruction load"
unit = "words"
better = "lower"
watch = 10500
noise = 50
script = "scripts/metrics/reading_set.py"
args = ["adversarial"]

[[metric]]
id = "shared-context"
title = "Shared context every station reads"
group = "instruction load"
unit = "words"
better = "lower"
noise = 50
script = "scripts/metrics/reading_set.py"
args = ["shared"]

