# MinionsFactory self-validates: the gate command list the orchestrator runs on this
# repo. The four pillars plus the spec-binding checker as the final step. Switched to
# `--strict` at phase 7: every test must carry a spec or spec_exempt marker (full
# bidirectional traceability), on top of the orphan + dangling checks.
gate = [
  "uv run ruff format --check .",
  "uv run ruff check .",
  "uv run ty check",
  "uv run pytest -q",
  "uv run python -m orchestrator specs check --strict",
]
